name: Lint scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.ps1'
      - 'guides/**'
      - 'README.md'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'scripts/**.ps1'
      - 'guides/**'
      - 'README.md'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell (parse + PSScriptAnalyzer)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse check (fail on syntax errors)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::group::Parse errors in $($_.Name)"
              $errors | ForEach-Object { Write-Host "::error::$($_.Extent.File): line $($_.Extent.StartLineNumber): $($_.Message)" }
              Write-Host "::endgroup::"
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer (fail on errors)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          }
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
          }
          $errors = @($results | Where-Object Severity -eq 'Error')
          $warnings = @($results | Where-Object Severity -eq 'Warning')
          Write-Host "PSScriptAnalyzer: $($errors.Count) error(s), $($warnings.Count) warning(s)."
          if ($errors.Count -gt 0) { exit 1 }
